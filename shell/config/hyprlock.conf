# Onyrion beta default for the mature ext-session-lock-v1 locker.
# Security semantics remain compositor-owned by Onyrion Core.
#
# Deliberately minimal: this guarantees a deterministic usable lock surface;
# visual polish is a separate UI scope.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgba(000000ff)
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2

    inner_color = rgba(1e1e2eff)
    outer_color = rgba(89b4faff)
    font_color = rgba(cdd6f4ff)
    fail_color = rgba(f38ba8ff)

    position = 0, 0
    halign = center
    valign = center
}
